<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>2026 F1 Season</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="laser-cursor"></div>
    <div class="laser-trail"></div>
    <!-- =================================================
         NAVBAR
    ================================================== -->

    <header class="navbar">
      <div class="brand">
        <div class="f1-logo">
          <span>F1</span
          ><span style="color: #ffffff; padding-left: 5px">26</span>
        </div>

        <div class="brand-divider"></div>

        <div class="brand-title">RACE DASHBOARD</div>
      </div>

      <div class="season">2026 SEASON</div>
    </header>

    <main>
      <!-- =================================================
             RACE SELECTOR
        ================================================== -->

      <section class="race-navigation">
        <div class="navigation-header">
          <div>
            <span class="eyebrow"> SELECT RACE </span>

            <h2>2026 Calendar</h2>
          </div>

          <div class="navigation-controls">
            <button
              class="nav-button"
              id="scrollLeft"
              type="button"
              aria-label="Previous races"
            >
              ←
            </button>

            <button
              class="nav-button"
              id="scrollRight"
              type="button"
              aria-label="Next races"
            >
              →
            </button>
          </div>
        </div>

        <div class="race-track-wrapper">
          <div class="race-track" id="raceTrack">
            <!-- Race buttons generated by JS -->
          </div>
        </div>
      </section>

      <!-- =================================================
             INITIAL EMPTY STATE
        ================================================== -->

      <section class="empty-state" id="emptyState">
        <div class="empty-line"></div>

        <div class="empty-content">
          <span class="eyebrow"> RACE DASHBOARD </span>

          <h1>
            Select a<br />
            Grand Prix.
          </h1>

          <p>
            Choose a race above to view its circuit, podium and fastest lap.
          </p>
        </div>
      </section>

      <!-- =================================================
             SELECTED RACE
        ================================================== -->

      <section class="race-view" id="raceView" hidden>
        <!-- =================================================
                 HERO
            ================================================== -->

        <section class="hero">
          <div class="hero-content">
            <span class="eyebrow" id="raceStatusLabel"> — </span>

            <h1 id="trackName">—</h1>

            <p id="trackLocation">—</p>

            <div class="race-meta">
              <div>
                <span> ROUND </span>

                <strong id="roundNumber"> — </strong>
              </div>

              <div>
                <span> DATE </span>

                <strong id="raceDate"> — </strong>
              </div>

              <div>
                <span> STATUS </span>

                <strong id="raceStatus"> — </strong>
              </div>
            </div>
          </div>

          <div class="track-image">
            <img id="trackImage" src="" alt="" />

            <div class="track-image-label">
              <span id="trackShortName"> — </span>
            </div>
          </div>
        </section>

        <!-- =================================================
                 PODIUM
            ================================================== -->

        <section class="section">
          <div class="section-heading">
            <span class="eyebrow"> RESULT </span>

            <h2>Podium</h2>
          </div>

          <div class="podium" id="podium">
            <!-- Generated by JS -->
          </div>
        </section>

        <!-- =================================================
                 FASTEST LAP
            ================================================== -->

        <section class="section">
          <div class="section-heading">
            <span class="eyebrow"> PACE </span>

            <h2>Fastest Lap</h2>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>DRIVER</th>

                  <th>TEAM</th>

                  <th>LAP</th>

                  <th>TIME</th>
                </tr>
              </thead>

              <tbody id="fastestLapTable">
                <!-- Generated by JS -->
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer>
      <div class="footer-logo">
        F1 <span style="color: #ffffff; font-size: inherit">26</span>
      </div>

      <p>Race data dashboard</p>

      <span> 2026 </span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
